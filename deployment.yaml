apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-devops-demo

  template:
    metadata:
      labels:
        app: python-devops-demo

    spec:
      containers:
        - name: python-devops-demo
          image: dcscc13/python-devops-demo:latest
          ports:
            - containerPort: 5000