name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  docker-and-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: dcscc13/python-devops-demo:latest

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Check Kubernetes
        run: |
          minikube status
          kubectl get nodes

      - name: Deploy Application
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/python-devops-demo --timeout=120s

      - name: Check Kubernetes Resources
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments

          echo "===== PODS ====="
          kubectl get pods -o wide

          echo "===== SERVICES ====="
          kubectl get services

      - name: Test Application
        run: |
          MINIKUBE_IP=$(minikube ip)
          NODE_PORT=$(kubectl get service python-devops-demo -o jsonpath='{.spec.ports[0].nodePort}')

          echo "Minikube IP: $MINIKUBE_IP"
          echo "NodePort: $NODE_PORT"

          echo "Testing application..."

          curl --fail --retry 10 --retry-delay 3 \
            http://$MINIKUBE_IP:$NODE_PORT

          echo ""
          echo "Application test successful!"
