name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: dcscc13/python-devops-demo
  IMAGE_TAG: latest
  DEPLOYMENT_NAME: python-devops-demo
  SERVICE_NAME: python-devops-demo

jobs:
  build-scan-deploy:
    name: Build, Scan, Deploy & Test
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout Source Code
      # ==================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # 2. Setup Python
      # ==================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ==================================================
      # 3. Install Dependencies
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi


      # ==================================================
      # 4. SonarQube Analysis
      # ==================================================
      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/.git/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/tests/**


      # ==================================================
      # 5. SonarQube Quality Gate
      # ==================================================
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


      # ==================================================
      # 6. Login to Docker Hub
      # ==================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==================================================
      # 7. Setup Docker Buildx
      # ==================================================
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==================================================
      # 8. Build and Push Docker Image
      # ==================================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ==================================================
      # 9. Start Minikube
      # ==================================================
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest


      # ==================================================
      # 10. Verify Kubernetes Cluster
      # ==================================================
      - name: Verify Kubernetes
        run: |
          echo "===== MINIKUBE STATUS ====="
          minikube status

          echo ""
          echo "===== KUBERNETES NODES ====="
          kubectl get nodes


      # ==================================================
      # 11. Deploy Application
      # ==================================================
      - name: Deploy Application
        run: |
          echo "===== DEPLOYING APPLICATION ====="

          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml


      # ==================================================
      # 12. Wait for Deployment
      # ==================================================
      - name: Wait for Deployment
        run: |
          echo "===== WAITING FOR DEPLOYMENT ====="

          kubectl rollout status \
            deployment/${{ env.DEPLOYMENT_NAME }} \
            --timeout=120s


      # ==================================================
      # 13. Verify Kubernetes Resources
      # ==================================================
      - name: Verify Kubernetes Resources
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments

          echo ""
          echo "===== PODS ====="
          kubectl get pods -o wide

          echo ""
          echo "===== SERVICES ====="
          kubectl get services


      # ==================================================
      # 14. Application Health Test
      # ==================================================
      - name: Test Application
        run: |
          echo "===== TESTING APPLICATION ====="

          MINIKUBE_IP=$(minikube ip)

          NODE_PORT=$(kubectl get service \
            ${{ env.SERVICE_NAME }} \
            -o jsonpath='{.spec.ports[0].nodePort}')

          URL="http://${MINIKUBE_IP}:${NODE_PORT}"

          echo "Application URL: ${URL}"

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            "${URL}")

          echo ""
          echo "===== APPLICATION RESPONSE ====="
          echo "${RESPONSE}"

          echo ""
          echo "Application test successful."


      # ==================================================
      # 15. GitHub Actions Summary
      # ==================================================
      - name: Generate Pipeline Summary
        if: always()
        run: |
          {
            echo "# 🚀 CI/CD Pipeline Summary"
            echo ""

            echo "## 🔎 SonarQube"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Project | \`${{ github.event.repository.name }}\` |"
            echo "| Project Key | \`${{ github.repository }}\` |"
            echo "| Quality Gate | Passed |"
            echo ""

            echo "## 🐳 Docker"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\` |"
            echo "| Registry | Docker Hub |"
            echo ""

            echo "## ☸️ Kubernetes"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Cluster | Minikube |"
            echo "| Deployment | \`${{ env.DEPLOYMENT_NAME }}\` |"
            echo "| Service | \`${{ env.SERVICE_NAME }}\` |"
            echo ""

            echo "## 📦 Pipeline Flow"
            echo ""
            echo '```text'
            echo "Git Push / Pull Request"
            echo "        ↓"
            echo "Checkout"
            echo "        ↓"
            echo "Python Setup"
            echo "        ↓"
            echo "Dependencies"
            echo "        ↓"
            echo "SonarQube Analysis"
            echo "        ↓"
            echo "Quality Gate"
            echo "        ↓"
            echo "Docker Build"
            echo "        ↓"
            echo "Docker Hub"
            echo "        ↓"
            echo "Minikube"
            echo "        ↓"
            echo "Kubernetes Deployment"
            echo "        ↓"
            echo "Application Test"
            echo "        ↓"
            echo "      SUCCESS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
