name: Build, Push and Deploy

on:
  push:
    branches:
      - mainname: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  docker-and-kubernetes:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image and push to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: dcscc13/python-devops-demo:latest

      # 4. Start Minikube inside GitHub Actions
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      # 5. Verify Kubernetes cluster
      - name: Check Kubernetes
        run: |
          minikube status
          kubectl get nodes

      # 6. Deploy application
      - name: Deploy Application
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      # 7. Wait until the deployment is ready
      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/python-devops-demo --timeout=120s

      # 8. Check Pods and Service
      - name: Check Kubernetes Resources
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments

          echo "===== PODS ====="
          kubectl get pods -o wide

          echo "===== SERVICES ====="
          kubectl get services

      # 9. Test the application
      - name: Test Application
        run: |
          MINIKUBE_IP=$(minikube ip)
          NODE_PORT=$(kubectl get service python-devops-demo -o jsonpath='{.spec.ports[0].nodePort}')

          echo "Minikube IP: $MINIKUBE_IP"
          echo "NodePort: $NODE_PORT"

          echo "Testing application..."

          curl --fail --retry 10 --retry-delay 3 \
            http://$MINIKUBE_IP:$NODE_PORT

          echo ""
          echo "Application test successful!"

