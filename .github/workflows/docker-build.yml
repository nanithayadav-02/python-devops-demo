name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  docker-and-kubernetes:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image and push to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: dcscc13/python-devops-demo:latest

      # 4. Start Minikube inside GitHub Actions
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      # 5. Check Kubernetes cluster
      - name: Check Minikube
        run: |
          minikube status
          kubectl get nodes

      # 6. Deploy application to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      # 7. Wait for deployment
      - name: Wait for Pods
        run: |
          kubectl rollout status deployment/python-devops-demo --timeout=120s

      # 8. Check Kubernetes resources
      - name: Check Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
