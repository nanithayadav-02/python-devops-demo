name: Build, Scan, Push and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: dcscc13/python-devops-demo
  IMAGE_TAG: latest

jobs:

  build-scan-push-deploy:
    name: Build, SonarQube, Docker and Kubernetes
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Generate SonarQube project information
      # --------------------------------------------------
      - name: Generate SonarQube project details
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          echo "SONAR_PROJECT_KEY=$REPO_NAME" >> "$GITHUB_ENV"
          echo "SONAR_PROJECT_NAME=$REPO_NAME" >> "$GITHUB_ENV"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "SonarQube Project Key: $REPO_NAME"
          echo "SonarQube Project Name: $REPO_NAME"

      # --------------------------------------------------
      # 3. SonarQube Scan
      # --------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_NAME }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/.git/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/tests/**

      # --------------------------------------------------
      # 4. SonarQube Quality Gate
      # --------------------------------------------------
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # --------------------------------------------------
      # 5. Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------
      # 6. Build and Push Docker Image
      # --------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # --------------------------------------------------
      # 7. Start Minikube
      # --------------------------------------------------
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      # --------------------------------------------------
      # 8. Check Kubernetes
      # --------------------------------------------------
      - name: Check Kubernetes cluster
        run: |
          echo "===== MINIKUBE STATUS ====="
          minikube status

          echo "===== KUBERNETES NODES ====="
          kubectl get nodes

      # --------------------------------------------------
      # 9. Deploy Application
      # --------------------------------------------------
      - name: Deploy Application
        run: |
          echo "===== DEPLOYING APPLICATION ====="

          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      # --------------------------------------------------
      # 10. Wait for Deployment
      # --------------------------------------------------
      - name: Wait for Kubernetes deployment
        run: |
          echo "===== WAITING FOR DEPLOYMENT ====="

          kubectl rollout status \
            deployment/python-devops-demo \
            --timeout=120s

      # --------------------------------------------------
      # 11. Check Kubernetes Resources
      # --------------------------------------------------
      - name: Check Kubernetes resources
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments

          echo ""
          echo "===== PODS ====="
          kubectl get pods -o wide

          echo ""
          echo "===== SERVICES ====="
          kubectl get services

      # --------------------------------------------------
      # 12. Test Application
      # --------------------------------------------------
      - name: Test application
        shell: bash
        run: |
          MINIKUBE_IP=$(minikube ip)

          NODE_PORT=$(kubectl get service python-devops-demo \
            -o jsonpath='{.spec.ports[0].nodePort}')

          echo "Minikube IP: $MINIKUBE_IP"
          echo "NodePort: $NODE_PORT"

          echo ""
          echo "===== TESTING APPLICATION ====="

          RESPONSE=$(curl \
            --fail \
            --retry 10 \
            --retry-delay 3 \
            "http://$MINIKUBE_IP:$NODE_PORT")

          echo "Application Response:"
          echo "$RESPONSE"

          echo ""
          echo "Application test successful!"

      # --------------------------------------------------
      # 13. GitHub Actions Summary
      # --------------------------------------------------
      - name: Deployment Summary
        shell: bash
        run: |
          MINIKUBE_IP=$(minikube ip)

          NODE_PORT=$(kubectl get service python-devops-demo \
            -o jsonpath='{.spec.ports[0].nodePort}')

          POD_STATUS=$(kubectl get pods \
            -l app=python-devops-demo \
            -o jsonpath='{range .items[*]}{.status.phase}{" "}{end}')

          {
            echo "# 🚀 CI/CD Pipeline Successful"
            echo ""

            echo "## 🔍 SonarQube"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Project | $SONAR_PROJECT_NAME |"
            echo "| Project Key | $SONAR_PROJECT_KEY |"
            echo "| Quality Gate | ✅ Passed |"
            echo ""

            echo "## 🐳 Docker"
            echo ""
            echo "**Image:** \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo ""

            echo "## ☸️ Kubernetes"
            echo ""
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| Deployment | python-devops-demo |"
            echo "| Replicas | 2 |"
            echo "| Minikube | Running |"
            echo "| NodePort | $NODE_PORT |"
            echo ""

            echo "### Pods"
            echo ""
            echo '```text'
            kubectl get pods \
              -l app=python-devops-demo \
              --no-headers
            echo '```'
            echo ""

            echo "### Service"
            echo ""
            echo '```text'
            kubectl get service python-devops-demo
            echo '```'
            echo ""

            echo "## 🧪 Application Test"
            echo ""
            echo "**Status:** ✅ Passed"
            echo ""
            echo "**Response:**"
            echo ""
            echo '```text'
            echo "Hello from my DevOps CI/CD Pipeline!"
            echo '```'
            echo ""

            echo "## 📦 Pipeline Flow"
            echo ""
            echo '```text'
            echo "Git Push"
            echo "   ↓"
            echo "GitHub Actions"
            echo "   ↓"
            echo "SonarQube Analysis"
            echo "   ↓"
            echo "Quality Gate"
            echo "   ↓"
            echo "Docker Build"
            echo "   ↓"
            echo "Docker Hub"
            echo "   ↓"
            echo "Minikube"
            echo "   ↓"
            echo "Kubernetes Deployment"
            echo "   ↓"
            echo "2 Pods"
            echo "   ↓"
            echo "Application Test"
            echo "   ↓"
            echo "✅ SUCCESS"
            echo '```'

          } >> "$GITHUB_STEP_SUMMARY"
